spring.config.activate.on-profile=prod
spring.application.name=basic-authentication
server.port=3001
# MySQL CONFIGURATIONS
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:basic_authentication}?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&connectTimeout=15000&socketTimeout=200000
spring.datasource.username=${MYSQL_USERNAME:produser}
spring.datasource.password=${MYSQL_PASSWORD:produser}
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jackson.default-property-inclusion=NON_NULL
spring.jpa.show-sql=true
# Session configs
server.servlet.session.timeout=60m
spring.session.jdbc.table-name=sessions
server.servlet.session.cookie.name=Authorization
# Logging Configurations
logging.config=classpath:log4j2-prod.xml
# Swagger Configurations
springdoc.swagger-ui.tags-sorter=alpha